name: Projection source quality

# Weekly, after Monday night's game: score Sleeper, ESPN, CBS, the Sleeper+ESPN
# blend and the published three-way mean against actuals for every completed
# week. The table lands in this run's job summary and site/data/source_quality.json.
on:
  schedule:
    - cron: "23 15 * * 2"   # Tuesday 15:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Past weeks' projections and stats do not change; keep the fetched copies.
      - uses: actions/cache@v4
        with:
          path: source_eval_cache
          key: source-eval-${{ github.run_id }}
          restore-keys: source-eval-

      - name: Score the sources
        run: |
          for attempt in 1 2 3; do
            python tools/evaluate_sources.py && exit 0
            echo "::warning::evaluate_sources attempt $attempt failed"
            sleep $((attempt * 60))
          done
          exit 1

      # Only this workflow writes source_quality.json,
      # so a rebase cannot conflict; it is retried only to ride out a
      # concurrent data commit.
      - name: Commit the report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/source_quality.json
          git diff --cached --quiet && exit 0
          git commit -m "data: projection source quality $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 20))
          done
          exit 1
