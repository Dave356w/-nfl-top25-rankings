name: Daily rankings

on:
  schedule:
    # Twice daily, every day. GitHub queued the old on-the-hour schedules by
    # 3-7 hours (13:00 UTC landed ~18:00-20:00), so these sit off the hour and
    # each has a backup that only builds if the primary has not landed yet.
    - cron: "23 14 * * *"   # morning: 6:23 PT / 9:23 ET
    - cron: "51 15 * * *"   # morning backup (skipped if a fresh snapshot exists)
    - cron: "37 21 * * *"   # afternoon: 1:37 PT, after the 4:00 ET injury reports
    - cron: "13 23 * * *"   # afternoon backup (skipped if a fresh snapshot exists)
    # Game-day refreshes (UTC; set for Eastern standard time, Nov-Mar). Each
    # lands just after a kickoff window's inactive lists (~90 min before kick)
    # and before the next kickoff. Off-the-hour minutes dodge GitHub's busiest
    # queue. Players whose game has started stay locked where the previous
    # run put them, so a late run can only move players who have not played.
    - cron: "7 13 * * 0"    # Sun: before the 9:30 ET international game
    - cron: "38 16 * * 0"   # Sun: after 1:00 ET inactives
    - cron: "4 20 * * 0"    # Sun: after 4:05/4:25 ET inactives
    - cron: "53 23 * * 0"   # Sun: after Sunday-night inactives
    - cron: "47 23 * * 4"   # Thu: after Thursday-night inactives
    - cron: "47 23 * * 1"   # Mon: after Monday-night inactives
  workflow_dispatch:
    inputs:
      top_n:
        description: "Players published per position"
        default: "50"
        required: false
  push:
    branches: [main]
    paths:
      - "site/**"
      - "pipeline/**"
      - "model/zero_score_calibration.json"
      - "market_audit.py"
      - "lineup_optimizer.py"
      - "run_lineup.py"
      - "run_daily.py"
      - "run_synced.py"
      - "run_showdown.py"
      - "lineup_roster.json"
      - "requirements.txt"
      - ".github/workflows/daily.yml"
      - ".github/workflows/lineup.yml"
      - ".github/workflows/showdown.yml"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      skipped: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      # A backup schedule builds only when its primary has not published in
      # the last 100 minutes (queued, delayed or failed). Every other trigger
      # -- primaries, game-day runs, pushes, manual runs -- always builds.
      - name: Skip a backup run when the primary already landed
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            "51 15 * * *"|"13 23 * * *")
              # The snapshot's own timestamp; a shallow checkout has no history.
              last=$(python3 -c "import json,datetime as d;print(int(d.datetime.fromisoformat(json.load(open('site/data/lineup/latest.json'))['generated_utc'].replace('Z','+00:00')).timestamp()))" 2>/dev/null || echo 0)
              age=$(( $(date +%s) - ${last:-0} ))
              if [ "$age" -lt 6000 ]; then
                echo "Fresh snapshot ${age}s old; backup run skipped."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi ;;
          esac
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip

      - if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      # Sleeper asks for /players/nfl (about 5MB) at most once a day. The
      # pipeline reuses a copy younger than 24h; this carries it across runs.
      - name: Date for the Sleeper player cache
        if: steps.gate.outputs.skip != 'true'
        id: day
        run: echo "utc=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          path: sleeper_cache
          key: sleeper-players-${{ steps.day.outputs.utc }}

      # A feed hiccup (Yahoo, Sleeper or ESPN) should cost a retry, not the
      # window. run_synced writes nothing until every page validates, so a
      # failed attempt leaves the last good snapshot in place.
      - name: Build synchronized rankings, lineup and Showdown
        if: steps.gate.outputs.skip != 'true'
        run: |
          for attempt in 1 2 3; do
            python run_synced.py --top-n "${{ inputs.top_n || '50' }}" && exit 0
            echo "::warning::run_synced attempt $attempt failed"
            sleep $((attempt * 90))
          done
          echo "::error::run_synced failed 3 times; the previous snapshot stays live"
          exit 1

      - name: Commit today's synchronized data
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rebases, or on conflict replays this snapshot onto latest main
          # (newer pages win), so re-runs and overlapping builds still land.
          python tools/publish_snapshot.py \
            --message "data: shared projection snapshot for $(date -u +%Y-%m-%d)"

  # Builds run independently. Pages deploys are the only shared critical
  # section, and each deploy publishes a fresh checkout of latest main.
  deploy:
    needs: build
    if: needs.build.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-publish
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Pages' artifact lookup fails intermittently: "No artifacts named
      # github-pages" (Nov 12, Nov 14) and "Multiple artifacts named
      # github-pages" (Nov 5, a re-run). The retry uploads a fresh artifact
      # under its own name and deploys that one, so neither failure repeats.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - if: steps.deployment.outcome == 'failure'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-retry-${{ github.run_attempt }}
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-retry-${{ github.run_attempt }}
