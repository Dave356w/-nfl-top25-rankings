name: Showdown models

on:
  # Scheduled and push-triggered refreshes live in daily.yml. Manual runs also
  # refresh rankings and the weekly lineup so Showdown cannot drift from them.
  workflow_dispatch:
    inputs:
      max_games:
        description: "Export only the first N games (blank = the whole slate)"
        default: ""
        required: false
      simulations:
        description: "Scenarios for the server-side reference portfolio"
        default: "20000"
        required: false
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt nflreadpy

      - name: Build synchronized rankings, lineup and Showdown
        run: |
          python run_synced.py \
            ${{ inputs.max_games && format('--showdown-max-games {0}', inputs.max_games) || '' }} \
            --showdown-simulations "${{ inputs.simulations || '20000' }}"

      - name: Commit this run's models
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No data change to commit."
            exit 0
          fi
          git commit -m "data: shared projection snapshot for $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep $((2 ** attempt))
          done
          exit 1

  # Builds run independently. Pages deploys are coalesced and always publish a
  # fresh checkout of latest main, so a stale model artifact cannot win a race.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-publish
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
