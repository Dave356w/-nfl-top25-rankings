name: Apply shared market audit patch

on:
  push:
    branches: [chatgpt/shared-market-audit-2]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/shared-market-audit-2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python tools/apply_shared_audit_patch.py
      - run: python tools/fix_role_tests.py
      - run: pip install -r requirements.txt
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Commit patched implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Share market projection audit across rankings and showdown"
          git push origin HEAD:chatgpt/shared-market-audit-2
