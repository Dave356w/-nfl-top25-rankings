name: Weekly lineup

on:
  # Scheduled refreshes live in daily.yml; this entry point keeps manual
  # lineup controls while publishing the same snapshot to every page.
  workflow_dispatch:
    inputs:
      objective:
        description: "What the lineup maximizes"
        type: choice
        default: "FP"
        options: ["FP", "Floor_P25", "Ceiling_P90"]
      exclude:
        description: "Players to force to the bench (comma-separated)"
        default: ""
        required: false
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Sleeper asks for /players/nfl (about 5MB) at most once a day. The
      # pipeline reuses a copy younger than 24h; this carries it across runs.
      - name: Date for the Sleeper player cache
        id: day
        run: echo "utc=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: sleeper_cache
          key: sleeper-players-${{ steps.day.outputs.utc }}

      - name: Build synchronized rankings, lineup and Showdown
        run: |
          for attempt in 1 2 3; do
            python run_synced.py \
              --objective "${{ inputs.objective || 'FP' }}" \
              --exclude "${{ inputs.exclude || '' }}" && exit 0
            echo "::warning::run_synced attempt $attempt failed"
            sleep $((attempt * 90))
          done
          echo "::error::run_synced failed 3 times; the previous snapshot stays live"
          exit 1

      - name: Commit this synchronized run
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rebases, or on conflict replays this snapshot onto latest main
          # (newer pages win), so re-runs and overlapping builds still land.
          python tools/publish_snapshot.py \
            --message "data: shared projection snapshot for $(date -u +%Y-%m-%d)"

  # Builds must never share one concurrency group: GitHub retains only one
  # pending run per group and can silently cancel another publisher. Deploys
  # may be coalesced because each one checks out the latest main after all data
  # produced by its own build has been committed.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-publish
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Pages' artifact lookup fails intermittently: "No artifacts named
      # github-pages" (Nov 12, Nov 14) and "Multiple artifacts named
      # github-pages" (Nov 5, a re-run). The retry uploads a fresh artifact
      # under its own name and deploys that one, so neither failure repeats.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - if: steps.deployment.outcome == 'failure'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-retry-${{ github.run_attempt }}
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-retry-${{ github.run_attempt }}
