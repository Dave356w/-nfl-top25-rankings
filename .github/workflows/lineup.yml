name: Weekly lineup

on:
  # Scheduled refreshes live in daily.yml; this entry point keeps manual
  # lineup controls while publishing the same snapshot to every page.
  workflow_dispatch:
    inputs:
      objective:
        description: "What the lineup maximizes"
        type: choice
        default: "FP"
        options: ["FP", "Floor_P25", "Ceiling_P90"]
      exclude:
        description: "Players to force to the bench (comma-separated)"
        default: ""
        required: false
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # nflreadpy is only needed here, so it is not in requirements.txt.
      - run: pip install -r requirements.txt nflreadpy

      - name: Build synchronized rankings, lineup and Showdown
        run: |
          python run_synced.py \
            --objective "${{ inputs.objective || 'FP' }}" \
            --exclude "${{ inputs.exclude || '' }}"

      - name: Commit this synchronized run
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No lineup change to commit."
            exit 0
          fi
          git commit -m "data: shared projection snapshot for $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep $((2 ** attempt))
          done
          exit 1

  # Builds must never share one concurrency group: GitHub retains only one
  # pending run per group and can silently cancel another publisher. Deploys
  # may be coalesced because each one checks out the latest main after all data
  # produced by its own build has been committed.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-publish
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
